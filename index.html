<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#006F3D" />
    <meta name="description" content="Учи арабский язык и Коран вместе с Ахмадом и Аминой" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Аль-Ильм" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" href="%BASE_URL%icons/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Al-Ilm / Аль-Ильм</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      if (import.meta.env.DEV && "serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations().catch(() => []);
        const appScope = new URL(import.meta.env.BASE_URL, location.origin).href;
        await Promise.all(registrations.filter((registration) => registration.scope === appScope).map((registration) => registration.unregister())).catch(() => {});

        if ("caches" in window) {
          const keys = await caches.keys().catch(() => []);
          const appPrefix = `al-ilm:${import.meta.env.BASE_URL.replace(/\/$/, "")}:`;
          await Promise.all(keys.filter((key) => key.startsWith(appPrefix) || /^al-ilm-v\d+$/.test(key)).map((key) => caches.delete(key))).catch(() => {});
        }

        if (navigator.serviceWorker.controller && !sessionStorage.getItem("alIlmDevSwCleared")) {
          sessionStorage.setItem("alIlmDevSwCleared", "true");
          window.location.reload();
        }
      }

      if (import.meta.env.PROD && "serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register(`${import.meta.env.BASE_URL}sw.js`, { scope: import.meta.env.BASE_URL }).catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
